name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
      - name: Extract and Build
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: |
          unzip -o *.zip
          
          # Generate the keystore in the exact absolute root path the error requested
          keytool -genkey -v -keystore $GITHUB_WORKSPACE/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug" || true
          
          PROJECT_ROOT=$(find . -name "build.gradle*" -o -name "settings.gradle*" | head -n 1)
          if [ -z "$PROJECT_ROOT" ]; then
            echo "COULD NOT FIND BUILD FILES."
            ls -laR
            exit 1
          fi
          cd "$(dirname "$PROJECT_ROOT")"
          
          gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoidPulse-APK
          path: "**/*.apk"
